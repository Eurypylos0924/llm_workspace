<!--
 app/templates/index.html (웹 UI 화면) 

 웹 브라우저에서 직접 질문을 입력하고 MCP 툴 연동 과정을 확인할 수 있는 인터페이스입니다.
 
-->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 {{ app_name }}</h1>
        <p class="subtitle">FastAPI → NVIDIA → MCP Host → MCP Server (stdio)</p>

        <div class="card">
            <h3>🛠️ 등록된 MCP Tools</h3>
            <button onclick="fetchTools()">Tools 목록 불러오기</button>
            <pre id="tools-list">버튼을 눌러 MCP Server의 Tools를 확인하세요.</pre>
        </div>

        <div class="card">
            <h3>💬 MCP 계산 테스트 (자연어 프롬프트)</h3>
            <div class="input-group">
                <input type="text" id="prompt-input" placeholder="예: 12.5에 4를 곱한 결과를 알려줘." value="12.5에 4를 곱한 결과를 알려줘.">
                <button onclick="sendPrompt()">전송</button>
            </div>
            
            <div id="result-box" class="result-box" style="display: none;">
                <h4>🤖 최종 답변:</h4>
                <p id="answer-text"></p>
                <div class="metadata">
                    <span id="tool-badge"></span>
                    <span id="result-badge"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchTools() {
            const res = await fetch('/api/tools');
            const data = await res.json();
            document.getElementById('tools-list').innerText = JSON.stringify(data, null, 2);
        }

        async function sendPrompt() {
            const prompt = document.getElementById('prompt-input').value;
            const resultBox = document.getElementById('result-box');
            
            resultBox.style.display = 'block';
            document.getElementById('answer-text').innerText = 'MCP Server 연산 처리 중...';

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt })
            });

            const data = await res.json();
            document.getElementById('answer-text').innerText = data.answer;
            document.getElementById('tool-badge').innerText = data.tool_used ? `사용된 Tool: ${data.tool_used}` : 'Tool 미사용';
            document.getElementById('result-badge').innerText = data.tool_result ? `MCP 연산 결과: ${data.tool_result}` : '';
        }
    </script>
</body>
</html>
