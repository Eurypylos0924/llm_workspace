<!--
 app/templates/index.html (웹 UI 화면)

 웹 브라우저에서 직접 질문을 입력하고 MCP 툴 연동 과정을 확인할 수 있는 인터페이스이다.

 실행 구조
 Browser
   ↓
 FastAPI /api/chat
   ↓
 MCPService
   ↓
 MCP Client
   ↓
 MCP Protocol
   ↓
 MCP Server
   ↓
 @mcp.tool() / @mcp.resource()
-->

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>🚀 {{ app_name }}</h1>

    <p class="subtitle">
        FastAPI → OpenAI → MCP Host → MCP Server (stdio)
    </p>


    <!-- =========================================================
         MCP Tools 목록
         ========================================================= -->
    <div class="card">

        <h3>🛠️ 등록된 MCP Tools</h3>

        <button onclick="fetchTools()">
            Tools 목록 불러오기
        </button>

        <pre id="tools-list">
버튼을 눌러 MCP Server의 Tools를 확인하세요.
        </pre>

    </div>


    <!-- =========================================================
         자연어 프롬프트
         ========================================================= -->
    <div class="card">

        <h3>💬 MCP 계산 테스트 (자연어 프롬프트)</h3>

        <div class="input-group">

            <input
                type="text"
                id="prompt-input"
                placeholder="예: 12.5에 4를 곱한 결과를 알려줘."
                value="12.5에 4를 곱한 결과를 알려줘."
                autocomplete="off"
            >

            <button onclick="sendPrompt()">
                전송
            </button>

        </div>


        <!-- Enter 키 안내 -->
        <p class="input-help">
            Enter 키를 눌러도 실행됩니다.
        </p>


        <!-- =====================================================
             결과 영역
             ===================================================== -->
        <div
            id="result-box"
            class="result-box"
            style="display: none;"
        >

            <h4>🤖 최종 답변:</h4>

            <p id="answer-text"></p>


            <!-- Tool / Resource 정보 -->
            <div class="metadata">

                <span id="tool-badge"></span>

                <span id="resource-badge"></span>

                <span id="result-badge"></span>

            </div>

        </div>

    </div>

</div>


<script>

/* ============================================================
   MCP Tools 목록 조회
   ============================================================ */

async function fetchTools() {

    try {

        const res = await fetch('/api/tools');

        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();

        document.getElementById('tools-list').innerText =
            JSON.stringify(data, null, 2);

    } catch (error) {

        console.error(error);

        document.getElementById('tools-list').innerText =
            `Tools 조회 중 오류가 발생했습니다.\n${error.message}`;

    }

}


/* ============================================================
   자연어 프롬프트 실행
   ============================================================ */

async function sendPrompt() {

    const input = document.getElementById('prompt-input');

    const prompt = input.value.trim();

    const resultBox = document.getElementById('result-box');

    const answerText = document.getElementById('answer-text');

    const toolBadge = document.getElementById('tool-badge');

    const resourceBadge = document.getElementById('resource-badge');

    const resultBadge = document.getElementById('result-badge');


    /* --------------------------------------------------------
       빈 프롬프트 방지
       -------------------------------------------------------- */

    if (!prompt) {

        alert('프롬프트를 입력해주세요.');

        input.focus();

        return;

    }


    /* --------------------------------------------------------
       결과 영역 표시
       -------------------------------------------------------- */

    resultBox.style.display = 'block';


    /* --------------------------------------------------------
       이전 결과 초기화
       -------------------------------------------------------- */

    answerText.innerText =
        'MCP Server 연산 처리 중...';

    toolBadge.innerText = '';

    resourceBadge.innerText = '';

    resultBadge.innerText = '';


    /* --------------------------------------------------------
       전송 중 버튼 비활성화
       -------------------------------------------------------- */

    const sendButton =
        document.querySelector('.input-group button');

    sendButton.disabled = true;


    try {

        /* ----------------------------------------------------
           FastAPI /api/chat 호출
           ---------------------------------------------------- */

        const res = await fetch('/api/chat', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                prompt: prompt
            })

        });


        /* ----------------------------------------------------
           HTTP 오류 확인
           ---------------------------------------------------- */

        if (!res.ok) {

            const errorText = await res.text();

            throw new Error(
                `HTTP ${res.status}\n${errorText}`
            );

        }


        /* ----------------------------------------------------
           JSON 응답
           ---------------------------------------------------- */

        const data = await res.json();


        /* ----------------------------------------------------
           최종 답변
           ---------------------------------------------------- */

        answerText.innerText =
            data.answer || '응답이 없습니다.';


        /* ====================================================
           Tool 사용 여부
           ==================================================== */

        if (data.tool_used) {

            toolBadge.innerText =
                `사용된 Tool: ${data.tool_used}`;

        } else {

            toolBadge.innerText =
                'Tool 미사용';

        }


        /* ====================================================
           Resource 사용 여부
           ==================================================== */

        if (data.resource_used) {

            resourceBadge.innerText =
                `사용된 Resource: ${data.resource_used}`;

        } else {

            resourceBadge.innerText =
                'Resource 미사용';

        }


        /* ====================================================
           MCP Tool 실행 결과
           ==================================================== */

        if (data.tool_result) {

            resultBadge.innerText =
                `MCP 연산 결과: ${data.tool_result}`;

        } else {

            resultBadge.innerText = '';

        }


    } catch (error) {

        console.error(error);

        answerText.innerText =
            `오류가 발생했습니다.\n${error.message}`;

        toolBadge.innerText = '';

        resourceBadge.innerText = '';

        resultBadge.innerText = '';

    } finally {

        /* ----------------------------------------------------
           전송 버튼 다시 활성화
           ---------------------------------------------------- */

        sendButton.disabled = false;

        input.focus();

    }

}


/* ============================================================
   Enter 키로 실행
   ============================================================ */

document
    .getElementById('prompt-input')
    .addEventListener('keydown', function(event) {

        /*
         Enter 키를 누르면 sendPrompt() 실행
        */

        if (event.key === 'Enter') {

            /*
             기본 Enter 동작 방지
             */

            event.preventDefault();

            /*
             MCP 요청 실행
             */

            sendPrompt();

        }

    });


</script>

</body>
</html>
