<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastAPI TTS</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>AI 텍스트 음성 변환기</h1>
    <p>텍스트를 입력하면 MP3 음성을 생성합니다.</p>
    <form id="tts-form">
      <label for="text">변환할 텍스트</label>
      <textarea id="text" maxlength="4000" required>안녕하세요. FastAPI 기반 TTS 실습입니다.</textarea>
      <div class="options">
        <div><label for="voice">목소리</label><select id="voice">
          <option>alloy</option><option>echo</option><option>fable</option>
          <option>onyx</option><option>nova</option><option>shimmer</option>
        </select></div>
        <div><label for="speed">속도: <span id="speed-value">1.00</span>배</label>
          <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1">
        </div>
      </div>
      <button id="submit" type="submit">음성 생성</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" hidden>
      <h2>생성된 음성</h2>
      <audio id="audio" controls></audio>
      <a id="download" download="tts_output.mp3">MP3 다운로드</a>
    </section>
  </main>
</body>
</html>
