<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브 내용 요약하기</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
</head>
<body>
<h1>유튜브 내용 요약 서비스</h1>
<input type="text" id="videoId" value="KPFVuGJ4WII" placeholder="유튜브 비디오 아이디를 입력하세요." size="20">
<button id="submit">요약하기</button>

<div id="status"></div>
<div id="response" style="margin-top: 20px;"></div>

<script>
    document.getElementById('submit').addEventListener('click', function() {
        const videoId = document.getElementById('videoId').value;

        if (!videoId) {
            alert('유튜브 비디오 아이디를 입력하세요.');
            return;
        }

        document.getElementById('status').innerHTML = '';
        document.getElementById('response').innerHTML = '';

        if (window.eventSource) {
            window.eventSource.close();
        } // 기존 EventSource가 있다면 닫기

        window.eventSource = new EventSource(`/youtube/summary/${videoId}`); // 새로운 EventSource 생성

        window.eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);

            if (data.status !== 'processing' && data.status !== 'complete') {
                if (data.message.includes("[download]")) {
                    updateDownloadStatus(data.message);
                } else {
                    updateStatus(data.message);
                }
            } // 다운로드 진행 중 메시지는 같은 줄에 덮어쓰기

            if (data.status === 'processing') {
                response.innerText += data.token;
            } // 요약 진행 중인 경우

            if (data.status === 'complete') {
                updateStatus(data.message);
                window.eventSource.close();
            } // 요약 완료
        };

        window.eventSource.onerror = function(err) {
            console.error('EventSource 오류:', err);
            updateStatus('오류 발생: 서버와 연결이 끊어졌습니다.');
            window.eventSource.close();
        };
    });

    // 상태 메시지 업데이트 함수 (일반 메시지 추가)
    function updateStatus(message) {
        const messageDiv = document.createElement('div');
        messageDiv.innerText = message;
        document.getElementById('status').appendChild(messageDiv);
    }

    // 다운로드 상태 업데이트 (덮어쓰기)
    function updateDownloadStatus(message) {
        let downloadStatus = document.getElementById('download-status');
        if (!downloadStatus) {
            downloadStatus = document.createElement('div');
            downloadStatus.id = 'download-status';
            document.getElementById('status').appendChild(downloadStatus);
        }
        downloadStatus.innerText = message;
    }
</script>
</body>
</html>
