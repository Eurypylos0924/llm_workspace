<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI App, Workflow, Agent 실행 경로 비교</title>
  <desc id="desc">같은 문서 처리 요청을 AI App, Workflow, Agent로 실행할 때 경로 결정 주체와 처리 과정이 어떻게 다른지 비교한다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
    <style>
      text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .title { font-size: 52px; font-weight: 700; }
      .subtitle { font-size: 25px; fill: #475569; }
      .lane-title { font-size: 31px; font-weight: 700; }
      .badge { font-size: 20px; font-weight: 700; }
      .node-title { font-size: 24px; font-weight: 700; }
      .node-sub { font-size: 19px; fill: #475569; }
      .guide-label { font-size: 20px; fill: #475569; }
      .guide-value { font-size: 22px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="70" y="78" class="title">같은 요청, 다른 실행 경로</text>
  <text x="72" y="120" class="subtitle">핵심은 결과가 아니라 “누가 다음 단계를 결정하는가?”입니다.</text>

  <rect x="55" y="175" width="250" height="540" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="235" text-anchor="middle" class="node-title">사용자 요청</text>
  <rect x="85" y="275" width="190" height="180" rx="20" fill="#f1f5f9"/>
  <text x="180" y="325" text-anchor="middle" class="node-sub">문서에서</text>
  <text x="180" y="363" text-anchor="middle" class="node-title">핵심 키워드를</text>
  <text x="180" y="401" text-anchor="middle" class="node-title">추출하고</text>
  <text x="180" y="439" text-anchor="middle" class="node-title">요약해줘</text>
  <text x="180" y="520" text-anchor="middle" class="guide-label">세 방식에</text>
  <text x="180" y="553" text-anchor="middle" class="guide-label">동일한 요청 사용</text>

  <rect x="345" y="175" width="1195" height="150" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="385" y="223" class="lane-title" fill="#1d4ed8">AI App</text>
  <rect x="520" y="186" width="185" height="43" rx="21" fill="#dbeafe"/>
  <text x="612" y="215" text-anchor="middle" class="badge" fill="#1d4ed8">경로 결정 없음</text>
  <line x1="305" y1="250" x2="665" y2="250" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <rect x="690" y="205" width="285" height="90" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="832" y="244" text-anchor="middle" class="node-title">LLM 한 번 호출</text>
  <text x="832" y="274" text-anchor="middle" class="node-sub">요청과 문서를 함께 전달</text>
  <line x1="975" y1="250" x2="1120" y2="250" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <rect x="1145" y="205" width="340" height="90" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="1315" y="244" text-anchor="middle" class="node-title">바로 답변</text>
  <text x="1315" y="274" text-anchor="middle" class="node-sub">단순하고 빠르지만 내부 단계 없음</text>

  <rect x="345" y="345" width="1195" height="170" rx="24" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="385" y="394" class="lane-title" fill="#047857">Workflow</text>
  <rect x="565" y="356" width="205" height="43" rx="21" fill="#d1fae5"/>
  <text x="667" y="385" text-anchor="middle" class="badge" fill="#047857">개발자가 경로 고정</text>
  <line x1="305" y1="430" x2="650" y2="430" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="675" y="385" width="225" height="90" rx="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="787" y="424" text-anchor="middle" class="node-title">키워드 추출</text>
  <text x="787" y="454" text-anchor="middle" class="node-sub">항상 1단계</text>
  <line x1="900" y1="430" x2="995" y2="430" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="1020" y="385" width="225" height="90" rx="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="1132" y="424" text-anchor="middle" class="node-title">문서 요약</text>
  <text x="1132" y="454" text-anchor="middle" class="node-sub">항상 2단계</text>
  <line x1="1245" y1="430" x2="1335" y2="430" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="1405" y="421" text-anchor="middle" class="node-title">예측 가능</text>
  <text x="1405" y="452" text-anchor="middle" class="node-sub">유연성은 낮음</text>

  <rect x="345" y="535" width="1195" height="180" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="385" y="584" class="lane-title" fill="#b45309">Agent</text>
  <rect x="505" y="546" width="190" height="43" rx="21" fill="#ffedd5"/>
  <text x="600" y="575" text-anchor="middle" class="badge" fill="#b45309">LLM이 Tool 선택</text>
  <line x1="305" y1="625" x2="650" y2="625" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <rect x="675" y="575" width="265" height="100" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <text x="807" y="617" text-anchor="middle" class="node-title">필요한 Tool 판단</text>
  <text x="807" y="649" text-anchor="middle" class="node-sub">요청에 따라 선택이 달라짐</text>
  <line x1="940" y1="625" x2="1030" y2="625" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <rect x="1055" y="575" width="260" height="100" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <text x="1185" y="617" text-anchor="middle" class="node-title">선택된 Tool만 실행</text>
  <text x="1185" y="649" text-anchor="middle" class="node-sub">유연하지만 누락 가능</text>
  <line x1="1315" y1="625" x2="1380" y2="625" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="1440" y="616" text-anchor="middle" class="node-title">동적 경로</text>
  <text x="1440" y="648" text-anchor="middle" class="node-sub">추가 비용</text>

  <rect x="55" y="760" width="1485" height="92" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="800" class="guide-label">선택 기준</text>
  <text x="230" y="800" class="guide-value" fill="#1d4ed8">단순한 한 번의 응답 → AI App</text>
  <text x="660" y="800" class="guide-value" fill="#047857">단계와 순서가 고정 → Workflow</text>
  <text x="1110" y="800" class="guide-value" fill="#b45309">입력마다 필요한 행동이 다름 → Agent</text>
  <text x="90" y="832" class="guide-label">Agent는 더 유연하지만 항상 더 좋은 선택은 아닙니다.</text>
</svg>
